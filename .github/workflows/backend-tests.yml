name: Backend Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  unit-and-api-tests:
    name: Unit and API Tests

    runs-on: ubuntu-latest

    # Variáveis utilizadas durante os testes automatizados
    env:
      NODE_ENV: test

      DATABASE_URL: mysql://test:test@127.0.0.1:3306/web_lib_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_NAME: web_lib_test

      JWT_SECRET: github-actions-test-secret

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run automated tests
        run: npm test
